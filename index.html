<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首爾櫻花祭 2026</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFB7C5">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@1.1/font/jf-openhuninn.css" rel="stylesheet">
  
  <style>
    :root { --sakura-pink: #FFB7C5; --soft-pink: #FFF0F5; --text-color: #4A4A4A; }
    
    /* 隱藏全站拉桿 */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* 🌸 終極防下拉鎖定：把外層網頁徹底鎖死 */
    html, body { 
      background-color: var(--soft-pink); font-family: 'jf-openhuninn', sans-serif; color: var(--text-color); 
      margin: 0; padding: 0; 
      width: 100%; height: 100%; /* 綁定螢幕高度 */
      overflow: hidden; /* 絕對禁止整個頁面被拉動 */
      overscroll-behavior: none; /* 阻擋原生的橡皮筋回彈 */
      -webkit-tap-highlight-color: transparent;
    }

    /* 🌸 讓內部區塊可以滑動，但滑到頂部直接「撞牆」不回彈 */
    .section { 
      display: none; 
      height: 100%; 
      overflow-y: auto; /* 只有這裡面可以上下滑 */
      overscroll-behavior-y: none; /* 到頂部不產生任何空隙 */
      -webkit-overflow-scrolling: touch; /* 保持手機順滑感 */
    }
    .active-section { display: block; }

    .fixed-header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background-color: var(--soft-pink); padding-top: env(safe-area-inset-top);
      box-shadow: 0 5px 15px rgba(0,0,0,0.02);
    }
    .app-header { text-align: center; padding: 15px 0 5px; }
    .app-title { font-weight: 900; color: #ff8fa3; font-size: 1.4rem; letter-spacing: 1px; }

    .weather-widget { 
      background-color: rgba(255,183,197,0.4); color: #000000; 
      padding: 6px 20px; border-radius: 25px; font-size: 0.85rem; 
      font-weight: bold; display: inline-block; margin-top: 5px;
    }

    .date-tabs-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px 10px; white-space: nowrap; scrollbar-width: none; }
    .date-tabs-container::-webkit-scrollbar { display: none; }
    .date-tab { 
      display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; 
      border: 1.5px solid var(--sakura-pink); color: var(--sakura-pink); border-radius: 18px; padding: 8px 22px; 
      font-weight: bold; flex-shrink: 0; min-width: 85px;
    }
    .date-tab.active { background: var(--sakura-pink); color: white; box-shadow: 0 4px 10px rgba(255,183,197,0.3); }

    .content-area { padding: 135px 15px 120px; min-height: 100vh; }
    
    .fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .pink-card { background: white; border-radius: 22px; border: none; box-shadow: 0 6px 18px rgba(255,183,197,0.2); margin-bottom: 18px; padding: 20px; }
    .note-badge { background: var(--sakura-pink); color: white; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; font-weight: bold; }
    
    .navbar { background: white !important; border-top: 1px solid #ffe4e9; padding-bottom: calc(env(safe-area-inset-bottom) + 5px); }
    .nav-btn { border: none; background: none; color: #bbb; font-weight: bold; font-size: 0.85rem; padding: 10px; flex: 1; }
    .nav-btn.active { color: var(--sakura-pink); background: #fff8f9; border-radius: 12px; }

    .total-box { background: linear-gradient(135deg, #FFB7C5 0%, #ff9fb1 100%); color: white; text-align: center; border-radius: 25px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(255,183,197,0.3); }
    
    .form-control-lg { border-radius: 15px !important; border: 2px solid #fff5f7; padding: 12px; font-size: 0.95rem; text-align: center; }
    
    .form-select-sm-custom { 
      border-radius: 15px !important; border: 2px solid #fff5f7; 
      padding: 12px 8px; font-size: 0.95rem; width: 100%; height: 100%;
    }
    
    .btn-pink { background: linear-gradient(135deg, #FFB7C5 0%, #ff8fa3 100%); color: white; border-radius: 18px; border: none; padding: 14px; font-weight: 900; width: 100%; }

    .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #FFF0F5 0%, #FFB7C5 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div id="loading" class="loading-screen">
    <div class="text-center">
      <div style="font-size: 5rem; animation: pulse 2s infinite;">🌸</div>
      <h2 class="fw-bold mt-3" style="color: white; letter-spacing: 5px;">SEOUL</h2>
      <div class="mt-2" style="color: white; opacity: 0.8; letter-spacing: 2px;">2026 CHERRY BLOSSOM</div>
    </div>
  </div>

  <div id="page-itinerary" class="section active-section">
    <div class="fixed-header">
      <div class="app-header">
        <div class="app-title">Seoul 2026.03</div>
        <div id="weather-info" class="weather-widget">讀取天氣中...</div>
      </div>
      <div id="itin-date-tabs" class="date-tabs-container"></div>
    </div>
    <div class="content-area" id="itinerary-list"></div>
  </div>

  <div id="page-budget" class="section">
    <div style="padding: 30px 15px 120px;">
      <h3 class="text-center mb-4 fw-bold" style="color: #ff8fa3;">旅程記帳本</h3>
      <div class="total-box">
        <div class="small opacity-75 mb-1">總花費累積 (NT$)</div>
        <div class="h2 fw-bold mb-0">NT$ <span id="total-twd">0</span></div>
      </div>
      <div class="pink-card">
        
        <div class="row g-2 mb-3">
          <div class="col-4">
            <select id="expense-category" class="form-select form-select-sm-custom">
              <option value="飲食">🍽️ 飲食</option><option value="交通">🚇 交通</option>
              <option value="購物">🛍️ 購物</option><option value="娛樂">🎟️ 娛樂</option><option value="其他">📌 其他</option>
            </select>
          </div>
          <div class="col-8">
            <input type="text" id="expense-item" class="form-control form-control-lg" placeholder="請輸入支出項目">
          </div>
        </div>

        <div class="row g-2 mb-4">
          <div class="col-5">
            <label class="small fw-bold mb-1 d-block text-center" style="color:#ff8fa3;">台幣 NT$</label>
            <input type="number" id="expense-twd" class="form-control form-control-lg text-danger fw-bold" placeholder="0">
          </div>
          <div class="col-7">
            <label class="small fw-bold mb-1 d-block text-center text-muted">韓元 ₩</label>
            <input type="number" id="expense-krw" class="form-control form-control-lg" placeholder="輸入韓元" oninput="autoCalcTWD()">
          </div>
        </div>
        
        <button onclick="submitExpense()" class="btn btn-pink" id="submit-btn">儲存這筆紀錄</button>
      </div>
      <div id="expense-list"></div>
    </div>
  </div>

  <div id="page-exchange" class="section">
    <div style="padding: 30px 15px 120px;">
      <h3 class="text-center mb-4 fw-bold" style="color: #ff8fa3;">快速換算</h3>
      <div class="pink-card text-center mb-4" style="background:#fff9fa;">
        <div class="text-muted small mb-1">即時匯率基準</div>
        <h4 class="fw-bold mb-0" style="color: var(--sakura-pink);">1 KRW = <span id="current-rate">--</span> TWD</h4>
      </div>
      <div class="pink-card">
        <label class="form-label fw-bold small">輸入韓元 (KRW)</label>
        <input type="number" id="quick-krw" class="form-control form-control-lg mb-4" placeholder="0" oninput="quickCalcTWD_Page()">
        <div class="text-center mb-4 opacity-25">▼</div>
        <label class="form-label fw-bold small">折合台幣 (TWD)</label>
        <input type="text" id="quick-twd" class="form-control form-control-lg text-danger fw-bold bg-light" readonly>
      </div>
    </div>
  </div>

  <nav class="navbar fixed-bottom py-2">
    <div class="container-fluid d-flex justify-content-evenly">
      <button onclick="showPage('itinerary', this)" class="nav-btn active">📅 行程</button>
      <button onclick="showPage('budget', this)" class="nav-btn">💰 記帳</button>
      <button onclick="showPage('exchange', this)" class="nav-btn">⚡ 匯率</button>
    </div>
  </nav>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx1sBOtKjH9gO1Q9OlUbXGbgmw3uzRLjanuKwAAfMcDkjq7-zNvsqRDcu-fEqKokjFK/exec'; 
    let globalData = { itinerary: [], routes: [] }, currentRate = 0.023, currentSelectedDate = "";

    function showPage(pageId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
      document.getElementById('page-' + pageId).classList.add('active-section');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); window.scrollTo(0,0);
    }

    function autoCalcTWD() {
      let krw = document.getElementById('expense-krw').value;
      document.getElementById('expense-twd').value = krw ? Math.round(krw * currentRate) : '';
    }

    function quickCalcTWD_Page() {
      let krw = document.getElementById('quick-krw').value;
      document.getElementById('quick-twd').value = krw ? Math.round(krw * currentRate).toLocaleString() : '0';
    }
