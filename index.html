<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首爾櫻花祭 2026</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFB7C5">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"首爾賞櫻","short_name":"首爾賞櫻","display":"standalone","background_color":"#FFB7C5","theme_color":"#FFB7C5","icons":[{"src":"sakura-icon.png","sizes":"192x192","type":"image/png"},{"src":"sakura-icon.png","sizes":"512x512","type":"image/png"}]}'>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@1.1/font/jf-openhuninn.css" rel="stylesheet">
  
  <style>
    :root { --sakura-pink: #FFB7C5; --soft-pink: #FFF0F5; --text-color: #4A4A4A; }
    
    html, body { 
      background-color: var(--soft-pink); font-family: 'jf-openhuninn', sans-serif; color: var(--text-color); 
      margin: 0; padding: 0; width: 100%; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
    }

    /* 你最喜歡的 🌸 Emoji 啟動畫面樣式 */
    .loading-screen { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, #FFF0F5 0%, #FFB7C5 100%); 
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; 
      transition: opacity 0.6s ease;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    #main-app { display: none; } /* 先隱藏主程式 */

    /* 原有的 UI 樣式 */
    .fixed-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background-color: var(--soft-pink); padding-top: env(safe-area-inset-top); box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
    .app-header { text-align: center; padding: 15px 0 5px; }
    .app-title { font-weight: 900; color: #ff8fa3; font-size: 1.4rem; letter-spacing: 1px; }
    .weather-widget { background-color: rgba(255,183,197,0.4); color: #000000; padding: 6px 20px; border-radius: 25px; font-size: 0.85rem; font-weight: bold; display: inline-block; margin-top: 5px; }
    .date-tabs-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px 15px; white-space: nowrap; scrollbar-width: none; }
    .date-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; border: 1.5px solid var(--sakura-pink); color: var(--sakura-pink); border-radius: 18px; padding: 8px 22px; font-weight: bold; flex-shrink: 0; min-width: 85px; }
    .date-tab.active { background: var(--sakura-pink); color: white; box-shadow: 0 4px 10px rgba(255,183,197,0.3); }
    .content-area { padding: 175px 15px 120px; min-height: 100vh; }
    .pink-card { background: white; border-radius: 22px; border: none; box-shadow: 0 6px 18px rgba(255,183,197,0.2); margin-bottom: 18px; padding: 20px; }
    .navbar { background: white !important; border-top: 1px solid #ffe4e9; padding-bottom: calc(env(safe-area-inset-bottom) + 5px); }
    .nav-btn { border: none; background: none; color: #bbb; font-weight: bold; font-size: 0.85rem; padding: 10px; flex: 1; }
    .nav-btn.active { color: var(--sakura-pink); background: #fff8f9; border-radius: 12px; }
    .total-box { background: linear-gradient(135deg, #FFB7C5 0%, #ff9fb1 100%); color: white; text-align: center; border-radius: 25px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(255,183,197,0.3); }
    .form-control-lg { border-radius: 15px !important; border: 2px solid #fff5f7; padding: 12px; font-size: 0.95rem; text-align: center; }
    .btn-pink { background: linear-gradient(135deg, #FFB7C5 0%, #ff8fa3 100%); color: white; border-radius: 18px; border: none; padding: 14px; font-weight: 900; width: 100%; }
    .section { display: none; }
    .active-section { display: block; }
  </style>
</head>
<body>

  <div id="loading" class="loading-screen">
    <div class="text-center">
      <div style="font-size: 5rem; animation: pulse 2s infinite;">🌸</div>
      <h2 class="fw-bold mt-3" style="color: white; letter-spacing: 5px;">SEOUL 2026</h2>
      <div class="mt-2" style="color: white; opacity: 0.8; letter-spacing: 2px;">please wait..</div>
    </div>
  </div>

  <div id="main-app">
    <div id="page-itinerary" class="section active-section">
      <div class="fixed-header">
        <div class="app-header">
          <div class="app-title">Seoul 2026.03</div>
          <div id="weather-info" class="weather-widget">讀取天氣中...</div>
        </div>
        <div id="itin-date-tabs" class="date-tabs-container"></div>
      </div>
      <div class="content-area" id="itinerary-list"></div>
    </div>

    <div id="page-budget" class="section">
      <div style="padding: 30px 15px 120px;">
        <h3 class="text-center mb-4 fw-bold" style="color: #ff8fa3;">旅程記帳本</h3>
        <div class="total-box">
          <div class="small opacity-75 mb-1">總花費累積 (NT$)</div>
          <div class="h2 fw-bold mb-0">NT$ <span id="total-twd">0</span></div>
        </div>
        <div class="pink-card">
          <div class="row g-2 mb-3">
            <div class="col-4">
              <select id="expense-category" class="form-select" style="border-radius:15px; border:2px solid #fff5f7; padding:12px;">
                <option value="飲食">🍽️ 飲食</option><option value="交通">🚇 交通</option>
                <option value="購物">🛍️ 購物</option><option value="娛樂">🎟️ 娛樂</option><option value="其他">📌 其他</option>
              </select>
            </div>
            <div class="col-8">
              <input type="text" id="expense-item" class="form-control form-control-lg" placeholder="支出項目">
            </div>
          </div>
          <div class="row g-2 mb-4">
            <div class="col-7">
              <label class="small fw-bold mb-1 d-block text-center text-muted">輸入韓元 ₩</label>
              <input type="number" id="expense-krw" class="form-control form-control-lg" placeholder="0" oninput="autoCalcTWD()">
            </div>
            <div class="col-5">
              <label class="small fw-bold mb-1 d-block text-center" style="color:#ff8fa3;">台幣 NT$</label>
              <input type="number" id="expense-twd" class="form-control form-control-lg text-danger fw-bold bg-light" readonly>
            </div>
          </div>
          <button onclick="submitExpense()" class="btn btn-pink" id="submit-btn">儲存這筆紀錄</button>
        </div>
        <div id="expense-list"></div>
      </div>
    </div>

    <div id="page-exchange" class="section">
      <div style="padding: 30px 15px 120px;">
        <h3 class="text-center mb-4 fw-bold" style="color: #ff8fa3;">快速換算</h3>
        <div class="pink-card text-center mb-4">
          <h4 class="fw-bold mb-0" style="color: var(--sakura-pink);">1 KRW = <span id="current-rate">--</span> TWD</h4>
        </div>
        <div class="pink-card">
          <label class="form-label fw-bold small">輸入韓元 (KRW)</label>
          <input type="number" id="quick-krw" class="form-control form-control-lg mb-4" oninput="quickCalcTWD_Page()">
          <input type="text" id="quick-twd" class="form-control form-control-lg text-danger fw-bold bg-light" readonly placeholder="折合台幣">
        </div>
      </div>
    </div>

    <nav class="navbar fixed-bottom py-2">
      <div class="container-fluid d-flex justify-content-evenly">
        <button onclick="showPage('itinerary', this)" class="nav-btn active">📅 行程</button>
        <button onclick="showPage('budget', this)" class="nav-btn">💰 記帳</button>
        <button onclick="showPage('exchange', this)" class="nav-btn">⚡ 匯率</button>
      </div>
    </nav>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx1sBOtKjH9gO1Q9OlUbXGbgmw3uzRLjanuKwAAfMcDkjq7-zNvsqRDcu-fEqKokjFK/exec'; 
    let globalData = { itinerary: [], routes: [] }, currentRate = 0.023, currentSelectedDate = "";

    // 隱藏載入畫面邏輯
    function hideLoader() {
      const loader = document.getElementById('loading');
      const app = document.getElementById('main-app');
      app.style.display = 'block';
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 600);
      }, 1000);
    }

    function showPage(pageId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
      document.getElementById('page-' + pageId).classList.add('active-section');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); window.scrollTo(0,0);
    }

    function autoCalcTWD() {
      let krw = document.getElementById('expense-krw').value;
      document.getElementById('expense-twd').value = krw ? Math.round(krw * currentRate) : '';
    }

    function quickCalcTWD_Page() {
      let krw = document.getElementById('quick-krw').value;
      document.getElementById('quick-twd').value = krw ? 'NT$ ' + Math.round(krw * currentRate).toLocaleString() : '';
    }

    async function fetchSeoulWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
        const d = await res.json();
        const temp = Math.round(d.current_weather.temperature);
        document.getElementById('weather-info').innerHTML = `📍首爾即時：🌸 ${temp}°C`;
      } catch (e) { document.getElementById('weather-info').innerHTML = `📍首爾：賞櫻愉快 🌸`; }
    }

    // 抓取 GAS 資料
    fetch(GAS_URL).then(res => res.json()).then(data => {
      globalData = data; currentRate = data.rate;
      document.getElementById('current-rate').innerText = currentRate.toFixed(4);
      let dates = [...new Set(data.itinerary.concat(data.routes).map(r => r[1]))].filter(d => d).sort();
      document.getElementById('itin-date-tabs').innerHTML = dates.map((d, i) => `<div class="date-tab ${i===0?'active':''}" onclick="filterItinerary('${d}', this)"><div>DAY ${i+1}</div><div>${d}</div></div>`).join('');
      if(dates.length > 0) filterItinerary(dates[0], document.querySelector('.date-tab'));
      updateList(data);
      hideLoader(); // 資料載入完畢，關閉 🌸 畫面
    });

    function filterItinerary(date, el) {
      currentSelectedDate = date;
      document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
      if(el) el.classList.add('active');
      let html = globalData.itinerary.filter(r => r[1] === date && r[2]).map(r => {
        let route = globalData.routes.find(rt => rt[2] === r[2]);
        let nav = (route && route[5]) ? `<a href="${route[5]}" target="_blank" class="btn btn-sm btn-success px-3" style="border-radius:12px; background:#03c75a;">NAVER</a>` : '';
        return `<div class="pink-card"><div class="d-flex justify-content-between mb-3"><span>${r[4]?'<span class="note-badge">🕒 '+r[4]+'</span>':''}</span>${nav}</div><h4 class="fw-bold">${r[2]}</h4><div class="text-muted small">${r[3]||''}</div></div>`;
      }).join('');
      document.getElementById('itinerary-list').innerHTML = html || '<p class="text-center py-5">今日暫無行程</p>';
    }

    function updateList(data) {
      let total = 0;
      let expHtml = data.expenses.slice().reverse().map(row => {
        let twd = parseFloat(row[4]) || Math.round(row[3] * currentRate);
        total += twd;
        return `<div class="pink-card d-flex justify-content-between align-items-center mb-2">
          <div><div class="small text-muted">${row[0]} | ${row[1]}</div><div class="fw-bold">${row[2]}</div></div>
          <div class="text-end"><div class="text-danger fw-bold">$${twd.toLocaleString()}</div><div class="text-muted small">₩${Number(row[3]).toLocaleString()}</div></div>
        </div>`;
      }).join('');
      document.getElementById('total-twd').innerText = total.toLocaleString();
      document.getElementById('expense-list').innerHTML = expHtml;
    }

    function submitExpense() {
      let btn = document.getElementById('submit-btn'); btn.disabled = true; btn.innerText = "儲存中...";
      fetch(GAS_URL, { method: 'POST', body: JSON.stringify({
        action: 'add', category: document.getElementById('expense-category').value, item: document.getElementById('expense-item').value,
        krwAmount: document.getElementById('expense-krw').value, twdAmount: document.getElementById('expense-twd').value
      })}).then(r => r.json()).then(d => { updateList(d); btn.disabled = false; btn.innerText = "儲存這筆紀錄"; });
    }

    fetchSeoulWeather();
  </script>
</body>
</html>
