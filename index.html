<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 首爾行程 🌸</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mars0210/open-huninn-font@master/jf-openhuninn.css">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFB7C5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root { --sakura-pink: #FFB7C5; --soft-pink: #FFF0F5; --text-color: #4A4A4A; }
    
    html, body { 
      background-color: var(--soft-pink); 
      /* 設定全局字體：Gaegu 優先，中文用粉圓體 */
      font-family: 'Gaegu', 'jf-openhuninn', sans-serif; 
      color: var(--text-color); 
      margin: 0; padding: 0; width: 100%; overflow-x: hidden;
    }

    /* 標題與重點文字加粗 Gaegu */
    .app-title, .h2, h3, h4, .fw-bold { font-family: 'Gaegu', 'jf-openhuninn', sans-serif; font-weight: 700; }

.fixed-header {
  position: sticky; /* 改成 sticky，它會佔據空間，但捲動時吸在頂部 */
  top: 0; left: 0; width: 100%; z-index: 1000; background-color: var(--soft-pink); padding-top: env(safe-area-inset-top); box-shadow: 0 5px 15px rgba(0,0,0,0.02);
}
    .app-header { text-align: center; padding: 15px 0 5px; }
    .app-title { color: #ff8fa3; font-size: 1.8rem; letter-spacing: 1px; }

    .weather-widget { 
      background-color: rgba(255,183,197,0.4); color: #000; 
      padding: 6px 20px; border-radius: 25px; font-size: 1rem; 
      font-weight: bold; display: inline-block; margin-top: 5px;
    }

    .date-tabs-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px 15px; white-space: nowrap; scrollbar-width: none; }
    .date-tabs-container::-webkit-scrollbar { display: none; }
    .date-tab { 
      display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; 
      border: 1.5px solid var(--sakura-pink); color: var(--sakura-pink); border-radius: 18px; padding: 8px 22px; 
      font-weight: bold; flex-shrink: 0; min-width: 85px; font-size: 1.1rem;
    }
    .date-tab.active { background: var(--sakura-pink); color: white; box-shadow: 0 4px 10px rgba(255,183,197,0.3); }

   .content-area { padding: 135px 15px 120px; min-height: 100vh; }
    .pink-card { background: white; border-radius: 22px; border: none; box-shadow: 0 6px 18px rgba(255,183,197,0.2); margin-bottom: 18px; padding: 20px; }
    
    .navbar { background: white !important; border-top: 1px solid #ffe4e9; padding-bottom: calc(env(safe-area-inset-bottom) + 5px); }
    .nav-btn { border: none; background: none; color: #bbb; font-weight: bold; font-size: 1.1rem; padding: 10px; flex: 1; font-family: 'Gaegu', sans-serif; }
    .nav-btn.active { color: var(--sakura-pink); background: #fff8f9; border-radius: 12px; }

    .total-box { background: linear-gradient(135deg, #FFB7C5 0%, #ff9fb1 100%); color: white; text-align: center; border-radius: 25px; padding: 25px; margin-bottom: 20px; }
    .btn-pink { background: linear-gradient(135deg, #FFB7C5 0%, #ff8fa3 100%); color: white; border-radius: 18px; border: none; padding: 14px; font-weight: 900; width: 100%; font-size: 1.2rem; }

    .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #FFF0F5 0%, #FFB7C5 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .section { display: none; }
    .active-section { display: block; }
  </style>
</head>
<body>

  <div id="loading" class="loading-screen">
    <div class="text-center">
      <div style="font-size: 5rem; animation: pulse 2s infinite;">🌸</div>
      <h2 class="fw-bold mt-3" style="color: white; letter-spacing: 5px;">SEOUL 2026</h2>
      <div class="mt-2" style="color: white; opacity: 0.8; letter-spacing: 2px; font-family: 'Gaegu';">loading your blossoms...</div>
    </div>
  </div>

  <div id="page-itinerary" class="section active-section">
    <div class="fixed-header">
      <div class="app-header">
        <div class="app-title">Seoul 2026.03</div>
        <div id="weather-info" class="weather-widget">Loading Weather...</div>
      </div>
      <div id="itin-date-tabs" class="date-tabs-container"></div>
    </div>
    <div class="content-area" id="itinerary-list"></div>
  </div>

  <div id="page-budget" class="section">
    <div style="padding: 30px 15px 120px;">
      <h3 class="text-center mb-4 fw-bold" style="color: #ff8fa3;">Money Diary</h3>
      <div class="total-box">
        <div class="small opacity-75 mb-1">Total (NT$)</div>
        <div class="h2 fw-bold mb-0">NT$ <span id="total-twd">0</span></div>
      </div>
      <div class="pink-card">
        <div class="row g-2 mb-3">
          <div class="col-4">
            <select id="expense-category" class="form-select" style="border-radius:15px;">
              <option value="飲食">🍽️ 飲食</option><option value="交通">🚇 交通</option>
              <option value="購物">🛍️ 購物</option><option value="娛樂">🎟️ 娛樂</option><option value="其他">📌 其他</option>
            </select>
          </div>
          <div class="col-8">
            <input type="text" id="expense-item" class="form-control" style="border-radius:15px;" placeholder="What did you buy?">
          </div>
        </div>
        <div class="row g-2 mb-4">
          <div class="col-5">
            <label class="small fw-bold d-block text-center" style="color:#ff8fa3;">NT$</label>
            <input type="number" id="expense-twd" class="form-control text-center fw-bold" readonly style="border-radius:15px; background:#f9f9f9;">
          </div>
          <div class="col-7">
            <label class="small fw-bold d-block text-center text-muted">KRW ₩</label>
            <input type="number" id="expense-krw" class="form-control text-center" style="border-radius:15px;" placeholder="Input ₩" oninput="autoCalcTWD()">
          </div>
        </div>
        <button onclick="submitExpense()" class="btn btn-pink" id="submit-btn">Save This 🌸</button>
      </div>
      <div id="expense-list"></div>
    </div>
  </div>

  <div id="page-exchange" class="section">
    <div style="padding: 30px 15px 120px;">
      <h3 class="text-center mb-4 fw-bold" style="color: #ff8fa3;">Quick Convert</h3>
      <div class="pink-card text-center mb-4" style="background:#fff9fa;">
        <div class="text-muted small mb-1">Today's Rate</div>
        <h4 class="fw-bold mb-0" style="color: var(--sakura-pink);">1 KRW = <span id="current-rate">--</span> TWD</h4>
      </div>
      <div class="pink-card">
        <label class="form-label fw-bold small">KRW ₩</label>
        <input type="number" id="quick-krw" class="form-control form-control-lg mb-4" style="border-radius:15px;" placeholder="0" oninput="quickCalcTWD_Page()">
        <div class="text-center mb-4 opacity-25">▼</div>
        <label class="form-label fw-bold small">TWD NT$</label>
        <input type="text" id="quick-twd" class="form-control form-control-lg text-danger fw-bold" readonly style="border-radius:15px; background:#f9f9f9;">
      </div>
    </div>
  </div>

  <nav class="navbar fixed-bottom py-2">
    <div class="container-fluid d-flex justify-content-evenly">
      <button onclick="showPage('itinerary', this)" class="nav-btn active">📅 Schedule</button>
      <button onclick="showPage('budget', this)" class="nav-btn">💰 Budget</button>
      <button onclick="showPage('exchange', this)" class="nav-btn">⚡ Rate</button>
    </div>
  </nav>

  <script>
    let globalData = { itinerary: [], routes: [], expenses: [] }, currentRate = 0.0215, currentSelectedDate = "";

    function showPage(pageId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
      document.getElementById('page-' + pageId).classList.add('active-section');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); window.scrollTo(0,0);
    }

    function autoCalcTWD() {
      let krw = document.getElementById('expense-krw').value;
      document.getElementById('expense-twd').value = krw ? Math.round(krw * currentRate) : '';
    }

    function quickCalcTWD_Page() {
      let krw = document.getElementById('quick-krw').value;
      document.getElementById('quick-twd').value = krw ? Math.round(krw * currentRate).toLocaleString() : '0';
    }

    async function fetchSeoulWeather() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
        const data = await response.json();
        const temp = Math.round(data.current_weather.temperature);
        document.getElementById('weather-info').innerHTML = `📍 Seoul: 🌸 ${temp}°C`;
      } catch (e) { document.getElementById('weather-info').innerHTML = `📍 Seoul: Enjoy Spring 🌸`; }
    }

    function filterItinerary(date, el) {
      currentSelectedDate = date;
      document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
      if(el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); }
      
      let html = globalData.itinerary.filter(r => r[1] === date && r[2]).map(r => {
        let route = globalData.routes.find(rt => rt[2] === r[2]);
        let nav = (route && route[5] && route[5].includes('http')) ? `<a href="${route[5]}" target="_blank" class="btn btn-sm btn-success" style="border-radius:10px; background:#03c75a; border:none; font-family:sans-serif; font-size:0.7rem;">NAVER</a>` : '';
        return `<div class="pink-card"><div class="d-flex justify-content-between align-items-center mb-2"><span>${r[4]?'<span class="badge bg-pink" style="background:#FFB7C5;">🕒 '+r[4]+'</span>':''}</span>${nav}</div><h4 class="fw-bold mb-1">${r[2]}</h4><div class="text-muted small">${r[3]||''}</div></div>`;
      }).join('');
      document.getElementById('itinerary-list').innerHTML = html || '<p class="text-center py-5 text-muted">Today is free! 🕊️</p>';
    }

    function updateList(data) {
      let total = 0;
      let expHtml = data.expenses.slice().reverse().map(row => {
        let twd = parseFloat(row[4]) || Math.round(row[3] * currentRate);
        total += twd;
        return `<div class="pink-card d-flex justify-content-between align-items-center mb-2" style="padding: 15px 20px;">
                  <div><div class="text-muted small" style="font-size:0.8rem;">${row[0]} | ${row[1]}</div><div class="fw-bold">${row[2]}</div></div>
                  <div class="text-end">
                    <div class="fw-bold text-danger">NT$ ${twd.toLocaleString()}</div><div class="text-muted" style="font-size:0.8rem;">₩${Number(row[3]).toLocaleString()}</div>
                  </div></div>`;
      }).join('');
      document.getElementById('total-twd').innerText = total.toLocaleString();
      document.getElementById('expense-list').innerHTML = expHtml || '<p class="text-center py-4 text-muted small">No records yet.</p>';
    }
  </script>
  
  <script src="app.js" defer></script>
</body>
</html>
