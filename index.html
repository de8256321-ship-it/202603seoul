<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>首爾櫻花 2026</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFB7C5">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://api.open-meteo.com">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    :root { --sakura-pink: #FFB7C5; --soft-pink: #FFF0F5; --text-color: #4A4A4A; }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      background-color: var(--soft-pink); 
      font-family: system-ui, -apple-system, sans-serif; 
      color: var(--text-color); width: 100%; height: 100%; position: fixed; 
      overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    }
    .section { 
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: auto; overscroll-behavior-y: none; -webkit-overflow-scrolling: touch;
      min-height: 100%; 
    }
    .active-section { display: block; }
    .fixed-header {
      position: sticky; top: 0; width: 100%; z-index: 1000;
      background-color: var(--soft-pink); padding-top: env(safe-area-inset-top);
      box-shadow: 0 5px 15px rgba(0,0,0,0.02);
    }
    .app-header { text-align: center; padding: 15px 0 5px; }
    .app-title { font-weight: 900; color: #ff8fa3; font-size: 1.4rem; letter-spacing: 1px; }
    .weather-widget { 
      background-color: rgba(255,183,197,0.4); color: #000000; padding: 6px 20px; 
      border-radius: 25px; font-size: 0.85rem; font-weight: bold; display: inline-block; margin-top: 5px;
    }
    .date-tabs-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px 5px; white-space: nowrap; }
    .date-tab { 
      display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; 
      border: 1.5px solid var(--sakura-pink); color: var(--sakura-pink); border-radius: 18px; padding: 8px 22px; 
      font-weight: bold; flex-shrink: 0; min-width: 85px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .date-tab.active { background: var(--sakura-pink); color: white; box-shadow: 0 4px 10px rgba(255,183,197,0.3); transform: scale(1.05); }
    .content-area { padding: 0px 15px 120px; min-height: calc(100vh - 150px); } 
    .pink-card { background: white; border-radius: 22px; border: none; box-shadow: 0 6px 18px rgba(255,183,197,0.2); margin-bottom: 18px; padding: 20px; }
    .note-badge { background: var(--sakura-pink); color: white; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; font-weight: bold; }
    .navbar { background: white !important; border-top: 1px solid #ffe4e9; padding-bottom: calc(env(safe-area-inset-bottom) + 5px); }
    .nav-btn { border: none; background: none; color: #bbb; font-weight: bold; font-size: 0.85rem; padding: 10px; flex: 1; }
    .nav-btn.active { color: var(--sakura-pink); background: #fff8f9; border-radius: 12px; }
    .total-box { background: linear-gradient(135deg, #FFB7C5 0%, #ff9fb1 100%); color: white; text-align: center; border-radius: 25px; padding: 25px; margin-bottom: 20px; }
    .btn-pink { background: linear-gradient(135deg, #FFB7C5 0%, #ff8fa3 100%); color: white; border-radius: 18px; border: none; padding: 14px; font-weight: 900; width: 100%; }
    .loading-screen { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, #FFF0F5 0%, #FFB7C5 100%); 
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.3s;
    }
    
    .fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    .slide-in-right { animation: slideInRight 0.3s ease-out forwards; }
    .slide-in-left { animation: slideInLeft 0.3s ease-out forwards; }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    
    .dropdown-toggle::after { display: none; }
    .custom-option:hover, .custom-option:focus { background-color: #fff0f5; color: var(--sakura-pink); font-weight: bold; }

    /* 🌸 專屬客製化超可愛刪除提示框樣式 */
    .custom-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; transition: opacity 0.3s ease;
    }
    .custom-modal-box {
      background: white; border-radius: 25px; padding: 30px 20px;
      width: 85%; max-width: 320px; box-shadow: 0 10px 30px rgba(255, 183, 197, 0.4);
      transform: translateY(20px) scale(0.95); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
    }
    .custom-modal-overlay.show { opacity: 1; }
    .custom-modal-overlay.show .custom-modal-box { transform: translateY(0) scale(1); }
    .delete-icon-btn { transition: transform 0.1s; }
    .delete-icon-btn:active { transform: scale(0.8); }
  </style>
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="text-center">
      <div style="font-size: 5rem; animation: pulse 1.5s infinite;">🌸</div>
      <h2 class="fw-bold mt-3" style="color: white; letter-spacing: 5px;">SEOUL</h2>
      <div class="mt-2" style="color: white; opacity: 0.8; letter-spacing: 2px;">正在喚醒資料庫...</div>
    </div>
  </div>

  <div id="page-itinerary" class="section active-section">
    <div class="fixed-header">
      <div class="app-header">
        <div class="app-title">Seoul 2026.03</div>
        <div id="weather-info" class="weather-widget">📍首爾即時：讀取中...</div>
      </div>
      <div id="itin-date-tabs" class="date-tabs-container"></div>
    </div>
    <div class="content-area" id="itinerary-list"></div>
  </div>

  <div id="page-budget" class="section">
    <div style="padding: 30px 15px 120px;">
      <h3 class="text-center mb-4 fw-bold" style="color: #ff8fa3;">旅程記帳本</h3>
      <div class="total-box">
        <div class="small opacity-75 mb-1">總花費累積 (NT$)</div>
        <div class="h2 fw-bold mb-0">NT$ <span id="total-twd">0</span></div>
      </div>
      <div class="pink-card">
        <div class="row g-2 mb-3">
          <div class="col-4">
            <input type="hidden" id="expense-category" value="飲食">
            <div class="dropdown w-100 h-100">
              <button class="btn w-100 h-100 d-flex justify-content-between align-items-center dropdown-toggle" type="button" id="categoryDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false" style="border-radius:15px; border: 2px solid #fff5f7; background: white; padding: 12px 8px; text-align: left; color: #4A4A4A; font-size: 0.95rem;">
                <span id="category-display" class="d-flex align-items-center"><img src="https://cdn.jsdelivr.net/gh/de8256321-ship-it/202603seoul@main/food.png" width="22" style="margin-right:5px;"> 飲食</span>
                <span class="opacity-50" style="font-size: 0.7rem;">▼</span>
              </button>
              <ul class="dropdown-menu w-100" aria-labelledby="categoryDropdownBtn" style="border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(255,183,197,0.3); padding: 8px;">
                <li><a class="dropdown-item custom-option py-2 d-flex align-items-center" href="#" data-value="飲食" style="border-radius: 10px;"><img src="https://cdn.jsdelivr.net/gh/de8256321-ship-it/202603seoul@main/food.png" width="22" style="margin-right:8px;"> 飲食</a></li>
                <li><a class="dropdown-item custom-option py-2 d-flex align-items-center" href="#" data-value="交通" style="border-radius: 10px;"><img src="https://cdn.jsdelivr.net/gh/de8256321-ship-it/202603seoul@main/traffic.png" width="22" style="margin-right:8px;"> 交通</a></li>
                <li><a class="dropdown-item custom-option py-2 d-flex align-items-center" href="#" data-value="購物" style="border-radius: 10px;"><img src="https://cdn.jsdelivr.net/gh/de8256321-ship-it/202603seoul@main/shop.png" width="22" style="margin-right:8px;"> 購物</a></li>
                <li><a class="dropdown-item custom-option py-2 d-flex align-items-center" href="#" data-value="娛樂" style="border-radius: 10px;"><img src="https://cdn.jsdelivr.net/gh/de8256321-ship-it/202603seoul@main/play.png" width="22" style="margin-right:8px;"> 娛樂</a></li>
                <li><a class="dropdown-item custom-option py-2 d-flex align-items-center" href="#" data-value="其他" style="border-radius: 10px;"><img src="https://cdn.jsdelivr.net/gh/de8256321-ship-it/202603seoul@main/other.png" width="22" style="margin-right:8px;"> 其他</a></li>
              </ul>
            </div>
          </div>
          <div class="col-8">
            <input type="text" id="expense-item" class="form-control h-100" style="border-radius:15px;" placeholder="支出項目">
          </div>
        </div>
        <div class="row g-2 mb-4">
          <div class="col-5">
            <input type="number" id="expense-twd" class="form-control text-danger fw-bold" placeholder="NT$" readonly>
          </div>
          <div class="col-7">
            <input type="number" id="expense-krw" class="form-control" placeholder="₩ 韓元" oninput="autoCalcTWD()">
          </div>
        </div>
        <button onclick="submitExpense()" class="btn btn-pink" id="submit-btn">儲存紀錄</button>
      </div>
      <div id="expense-list"></div>
    </div>
  </div>

  <div id="page-exchange" class="section">
    <div style="padding: 30px 15px 120px;">
      <h3 class="text-center mb-4 fw-bold" style="color: #ff8fa3;">快速換算</h3>
      <div class="pink-card text-center mb-4">
        <div class="text-muted small mb-1">即時匯率基準</div>
        <h4 class="fw-bold mb-0" style="color: var(--sakura-pink);">1 KRW = <span id="current-rate">0.0235</span> TWD</h4>
      </div>
      <div class="pink-card">
        <label class="small fw-bold mb-2">輸入韓元 (KRW)</label>
        <input type="number" id="quick-krw" class="form-control form-control-lg mb-4" oninput="quickCalcTWD_Page()">
        <label class="small fw-bold mb-2">折合台幣 (TWD)</label>
        <input type="text" id="quick-twd" class="form-control form-control-lg text-danger fw-bold bg-light" readonly>
      </div>
    </div>
  </div>

  <nav class="navbar fixed-bottom py-2">
    <div class="container-fluid d-flex justify-content-evenly">
      <button onclick="showPage('itinerary', this)" class="nav-btn active">📅 行程</button>
      <button onclick="showPage('budget', this)" class="nav-btn">💰 記帳</button>
      <button onclick="showPage('exchange', this)" class="nav-btn">⚡ 匯率</button>
    </div>
  </nav>

  <div id="deleteConfirmModal" class="custom-modal-overlay">
    <div class="custom-modal-box">

      <h4 class="fw-bold mb-2" style="color: #ff8fa3;">確定要刪除嗎？</h4>
      <p class="text-muted small mb-4" id="delete-item-name">刪除後將無法恢復這筆紀錄喔！</p>
      <div class="d-flex justify-content-center gap-3">
        <button class="btn btn-light fw-bold" style="border-radius: 15px; width: 45%; color: #aaa;" onclick="closeDeleteModal()">先不要</button>
        <button class="btn btn-pink fw-bold" id="confirm-delete-btn" style="border-radius: 15px; width: 45%;" onclick="executeDelete()">確定刪除</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
    }

    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx1sBOtKjH9gO1Q9OlUbXGbgmw3uzRLjanuKwAAfMcDkjq7-zNvsqRDcu-fEqKokjFK/exec';
    let globalData = { itinerary: [], routes: [], expenses: [] }, currentRate = 0.0235, currentSelectedDate = "";
    
    // 儲存準備被刪除的資料索引
    let targetDeleteIndex = -1;

    function showPage(pageId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
      document.getElementById('page-' + pageId).classList.add('active-section');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function autoCalcTWD() {
      let krw = document.getElementById('expense-krw').value;
      document.getElementById('expense-twd').value = krw ? Math.round(krw * currentRate) : '';
    }

    function quickCalcTWD_Page() {
      let krw = document.getElementById('quick-krw').value;
      document.getElementById('quick-twd').value = krw ? Math.round(krw * currentRate).toLocaleString() : '0';
    }

    async function fetchSeoulWeather() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true&timezone=Asia%2FSeoul');
        const data = await response.json();
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode; 
        
        let icon = "☀️"; 
        if (code === 0) icon = "☀️"; 
        else if (code <= 2) icon = "🌥️"; 
        else if (code <= 48) icon = "☁️"; 
        else icon = "🌧️";
        
        document.getElementById('weather-info').innerHTML = `📍首爾即時：${icon} ${temp}°C`;
      } catch (e) { 
        document.getElementById('weather-info').innerHTML = `📍首爾：賞櫻愉快 🌸`; 
      }
    }

    function renderApp(data) {
      globalData = data; 
      currentRate = data.rate || 0.0235;
      document.getElementById('current-rate').innerText = currentRate.toFixed(4);
      let dates = [...new Set(data.itinerary.concat(data.routes).map(r => r[1]))].filter(d => d).sort();
      document.getElementById('itin-date-tabs').innerHTML = dates.map((d, i) => `<div class="date-tab ${i===0?'active':''}" onclick="filterItinerary('${d}', this)"><div style="font-size: 0.6rem; opacity:0.6;">DAY ${i+1}</div><div>${d}</div></div>`).join('');
      if (dates.length > 0 && !currentSelectedDate) filterItinerary(dates[0], document.querySelector('.date-tab'));
      updateList(data);
    }

    function filterItinerary(date, el) {
      if (currentSelectedDate === date) return;

      let dates = [...new Set(globalData.itinerary.concat(globalData.routes).map(r => r[1]))].filter(d => d).sort();
      let oldIndex = dates.indexOf(currentSelectedDate);
      let newIndex = dates.indexOf(date);
      let direction = 'up'; 
      
      if (oldIndex !== -1) {
          direction = newIndex > oldIndex ? 'right' : 'left';
      }

      currentSelectedDate = date;
      document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
      if(el) {
        el.classList.add('active');
        el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); 
      }
      
      const listDiv = document.getElementById('itinerary-list');
      
      listDiv.classList.remove('fade-in-up', 'slide-in-left', 'slide-in-right');
      void listDiv.offsetWidth; 
      
      if (direction === 'left') listDiv.classList.add('slide-in-left');
      else if (direction === 'right') listDiv.classList.add('slide-in-right');
      else listDiv.classList.add('fade-in-up');

      let html = globalData.itinerary.filter(r => r[1] === date && r[2]).map(r => {
        let route = globalData.routes.find(rt => rt[2] === r[2]);
        let nav = (route && route[5] && route[5].includes('http')) ? `<a href="${route[5]}" target="_blank" class="btn btn-sm btn-success px-3" style="border-radius:12px; background:#03c75a;">NAVER</a>` : '';
        return `<div class="pink-card"><div class="d-flex justify-content-between align-items-center mb-3"><span>${r[4]?'<span class="note-badge">🕒 '+r[4]+'</span>':''}</span>${nav}</div><h4 class="fw-bold mb-1">${r[2]}</h4><div class="text-muted small">${r[3]||''}</div></div>`;
      }).join('');
      listDiv.innerHTML = html || '<p class="text-center py-5 text-muted">今日暫無行程</p>';
    }

    // 🌸 更新記帳列表：加入了你的專屬 delete.png 按鈕
    function updateList(data) {
      let total = 0;
      // 利用 map 記住原本的 index，再 reverse() 反轉陣列讓最新的一筆在最上面
      let expHtml = (data.expenses || []).map((row, index) => ({row, index})).reverse().map(item => {
        let row = item.row;
        let originalIndex = item.index; // 記住這筆資料在 Google Sheet 裡的真實位置
        let twd = parseFloat(row[4]) || Math.round(row[3] * currentRate);
        total += twd;
        
        return `<div class="pink-card d-flex justify-content-between align-items-center mb-2" style="padding: 15px 20px;">
                  <div>
                    <div class="text-muted small">${row[1]}</div>
                    <div class="fw-bold">${row[2]}</div>
                  </div>
                  <div class="d-flex align-items-center">
                    <div class="text-end me-3">
                      <div class="fw-bold text-danger">$${twd.toLocaleString()}</div>
                      <div class="text-muted small">₩${Number(row[3]).toLocaleString()}</div>
                    </div>
                    <img src="https://cdn.jsdelivr.net/gh/de8256321-ship-it/202603seoul@main/delete.png" width="22" class="delete-icon-btn" style="cursor: pointer; opacity: 0.8;" onclick="openDeleteModal(${originalIndex}, '${row[2]}')">
                  </div>
                </div>`;
      }).join('');
      document.getElementById('total-twd').innerText = total.toLocaleString();
      document.getElementById('expense-list').innerHTML = expHtml;
    }

    // 🌸 刪除彈出視窗的開關控制
    function openDeleteModal(index, itemName) {
      targetDeleteIndex = index;
      document.getElementById('delete-item-name').innerText = `你要刪除「${itemName}」嗎？`;
      const modal = document.getElementById('deleteConfirmModal');
      modal.style.display = 'flex';
      // 用微小的延遲觸發 CSS 動畫
      setTimeout(() => modal.classList.add('show'), 10);
    }

    function closeDeleteModal() {
      const modal = document.getElementById('deleteConfirmModal');
      modal.classList.remove('show');
      setTimeout(() => { modal.style.display = 'none'; targetDeleteIndex = -1; }, 300);
    }

    // 🌸 執行刪除動作 (發送請求給 GAS)
    function executeDelete() {
      if(targetDeleteIndex === -1) return;
      
      let btn = document.getElementById('confirm-delete-btn');
      btn.innerHTML = '刪除中...';
      btn.disabled = true;

      fetch(GAS_URL, { 
        method: 'POST', 
        body: JSON.stringify({ action: 'delete', index: targetDeleteIndex })
      }).then(r => r.json()).then(d => {
        localStorage.setItem('seoulAppData', JSON.stringify(d)); 
        updateList(d); // 更新畫面
        closeDeleteModal();
        btn.innerHTML = '確定刪除'; btn.disabled = false;
      }).catch(err => {
        alert('連線失敗，請檢查網路！');
        closeDeleteModal();
        btn.innerHTML = '確定刪除'; btn.disabled = false;
      });
    }

    function hideLoading() {
      const loading = document.getElementById('loading');
      loading.style.opacity = '0';
      setTimeout(() => { loading.style.display = 'none'; }, 300);
    }

    document.querySelectorAll('.custom-option').forEach(item => {
      item.addEventListener('click', event => {
        event.preventDefault(); 
        let selectedValue = item.getAttribute('data-value');
        document.getElementById('expense-category').value = selectedValue;
        document.getElementById('category-display').innerHTML = item.innerHTML;
      });
    });

    let touchStartX = 0; let touchStartY = 0;
    const itinPage = document.getElementById('page-itinerary');

    itinPage.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    itinPage.addEventListener('touchend', e => {
      if (!itinPage.classList.contains('active-section')) return;
      let dx = e.changedTouches[0].screenX - touchStartX; 
      let dy = e.changedTouches[0].screenY - touchStartY; 

      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        let dates = [...new Set(globalData.itinerary.concat(globalData.routes).map(r => r[1]))].filter(d => d).sort();
        let currentIndex = dates.indexOf(currentSelectedDate);
        if (dx < 0 && currentIndex < dates.length - 1) filterItinerary(dates[currentIndex + 1], document.querySelectorAll('.date-tab')[currentIndex + 1]);
        else if (dx > 0 && currentIndex > 0) filterItinerary(dates[currentIndex - 1], document.querySelectorAll('.date-tab')[currentIndex - 1]);
      }
    }, {passive: true});

    fetchSeoulWeather();
    const cachedData = localStorage.getItem('seoulAppData');
    if (cachedData) { renderApp(JSON.parse(cachedData)); hideLoading(); }

    fetch(GAS_URL).then(res => res.json()).then(data => {
      localStorage.setItem('seoulAppData', JSON.stringify(data));
      renderApp(data); 
      hideLoading(); 
    }).catch(err => { hideLoading(); });

    function submitExpense() {
      let btn = document.getElementById('submit-btn'); btn.disabled = true;
      fetch(GAS_URL, { method: 'POST', body: JSON.stringify({
        action: 'add', category: document.getElementById('expense-category').value, item: document.getElementById('expense-item').value,
        krwAmount: document.getElementById('expense-krw').value, twdAmount: document.getElementById('expense-twd').value
      })}).then(r => r.json()).then(d => {
        localStorage.setItem('seoulAppData', JSON.stringify(d)); 
        updateList(d); btn.disabled = false;
        ['expense-item','expense-krw','expense-twd'].forEach(id => document.getElementById(id).value='');
        document.getElementById('expense-category').value = '飲食';
        document.getElementById('category-display').innerHTML = '<img src="https://cdn.jsdelivr.net/gh/de8256321-ship-it/202603seoul@main/food.png" width="22" style="margin-right:8px;"> 飲食';
      });
    }
  </script>
</body>
</html>
